<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Lucky Snap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;800&display=swap" rel="stylesheet">
  <!-- Tailwind se compila en build (tailwind.config.js); ya no se usa el Play CDN -->
  <script>
    // Colores de marca de la visita anterior (los guarda ThemeContext), aplicados antes del
    // primer pintado para no mostrar los colores por defecto mientras llega /public/settings.
    try {
      var c = JSON.parse(localStorage.getItem('ls_theme_colors') || 'null');
      if (c) {
        var vars = { backgroundPrimary: '--color-background-primary', backgroundSecondary: '--color-background-secondary', accent: '--color-accent', action: '--color-action' };
        for (var k in vars) {
          var m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(c[k] || '');
          if (m) document.documentElement.style.setProperty(vars[k], parseInt(m[1], 16) + ' ' + parseInt(m[2], 16) + ' ' + parseInt(m[3], 16));
        }
      }
    } catch (e) {}
  </script>
  <style>
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: rgb(var(--color-background-secondary)); }
    ::-webkit-scrollbar-thumb { background-color: rgb(255 255 255 / 0.18); border-radius: 10px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/tailwind.css">
</head>
<body class="bg-background-primary">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
